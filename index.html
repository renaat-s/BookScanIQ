<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Content Security Policy: restrict where scripts/frames/connections may originate.
         'unsafe-inline' + 'unsafe-eval' remain for Vite/React runtime + Stripe checkout.
         Adjust the allowlist when adding a new third-party domain. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        base-uri 'self';
        object-src 'none';
        form-action 'self' https://checkout.stripe.com https://billing.stripe.com;
        frame-ancestors 'self';
        img-src 'self' data: blob: https:;
        font-src 'self' data: https://fonts.gstatic.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com https://cdn.gpteng.co;
        connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.stripe.com https://www.googleapis.com https://accounts.google.com https://oauth2.googleapis.com;
        frame-src 'self' https://js.stripe.com https://checkout.stripe.com https://hooks.stripe.com https://accounts.google.com https://drive.google.com https://docs.google.com;
        upgrade-insecure-requests;
      "
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <title>InvoiceIQ - AI-Powered Invoice Processing & Automation</title>
    <meta name="description" content="Transform your invoice management with InvoiceIQ's AI agent. Automate extraction, processing, and approvals with 99% accuracy. Save time and eliminate manual errors." />
    <meta name="author" content="InvoiceIQ" />
    <link rel="canonical" href="https://invoice-iq.com" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="InvoiceIQ" />


    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://invoice-iq.com" />
    <meta property="og:title" content="InvoiceIQ - AI-Powered Invoice Processing & Automation" />
    <meta property="og:description" content="Transform your invoice management with InvoiceIQ's AI agent. Automate extraction, processing, and approvals with 99% accuracy." />
    <meta property="og:image" content="https://invoice-iq.com/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://invoice-iq.com" />
    <meta property="twitter:title" content="InvoiceIQ - AI-Powered Invoice Processing & Automation" />
    <meta property="twitter:description" content="Transform your invoice management with InvoiceIQ's AI agent. Automate extraction, processing, and approvals with 99% accuracy." />
    <meta property="twitter:image" content="https://invoice-iq.com/og-image.png" />

    <!-- Speed: warm up TLS to the backend before the first API call -->
    <link rel="preconnect" href="https://wdnlblakhdfrpobyxlsa.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://wdnlblakhdfrpobyxlsa.supabase.co" />

    <!-- Futuristic typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Chakra+Petch:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
